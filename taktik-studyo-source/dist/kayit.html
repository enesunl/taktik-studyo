<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kayıt Ol — Taktik Stüdyo</title>
  <link rel="stylesheet" href="auth.css">
  <script src="backend.js" defer></script>
</head>
<body data-auth-page="register">
  <main class="auth-card">
    <a class="brand" href="/">TAKTİK STÜDYO</a>
    <p class="eyebrow">YENİ HESAP</p>
    <h1>Stüdyoya katıl.</h1>
    <p class="intro">Hesabını oluştur, ardından e-posta adresini doğrula.</p>
    <form id="authForm">
      <label for="username">Kullanıcı adı</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" aria-describedby="usernameHint" required>
      <p id="usernameHint" class="hint">3–24 karakter: A–Z, a–z, 0–9 veya _. Kullanıcı adının uygunluğu profil oluşturulurken belirlenir.</p>
      <label for="email">E-posta</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Şifre</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" aria-describedby="passwordHint" required>
      <p id="passwordHint" class="hint">En az 12 karakter. Şifre yöneticini kullanabilirsin.</p>
      <label for="passwordConfirmation">Şifre tekrar</label>
      <input id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="12" required>
      <button id="authSubmit" type="submit" disabled>Kayıt Ol</button>
    </form>
    <p id="authMessage" class="message" role="alert" aria-live="polite" aria-atomic="true"></p>
    <p id="profileMessage" class="profile-message" role="status" aria-live="polite"></p>
    <p class="footnote">Zaten hesabın var mı? <a href="giris.html">Giriş Yap</a></p>
    <noscript>Kayıt olabilmek için JavaScript'i etkinleştir.</noscript>
  </main>
</body>
</html>
