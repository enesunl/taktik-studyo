</main><template id="profileTemplate">
  <header class="profile-hero">
    <span id="profileInitials" class="profile-initials" aria-hidden="true">TS</span>

    <div class="profile-hero-actions"><button id="profileEdit" type="button" aria-controls="profileEditForm" aria-expanded="false" disabled>Profili Düzenle</button></div>

  <section class="profile-workspace" aria-labelledby="profileRecentTitle">
    <dl id="profileStats" class="profile-stats" hidden>
      <div><dt>TOPLAM ÇALIŞMA</dt><dd id="profileCountTotal"></dd></div>
      <div><dt>SERBEST STÜDYO</dt><dd id="profileCountFree"></dd></div>
      <div><dt>MAÇ ÇALIŞMASI</dt><dd id="profileCountMatch"></dd></div>
    </dl>
    <div class="profile-section-heading"><h2 id="profileRecentTitle">Son çalışmalar</h2><a href="/calismalarim">Tüm çalışmalarımı gör →</a></div>
    <p id="profileProjectsStatus" role="status" aria-live="polite" aria-atomic="true"></p><button id="profileProjectsRetry" type="button" hidden>Çalışmaları tekrar yükle</button>
    <div id="profileRecent" class="profile-recent"></div>
    <div id="profileEmpty" class="profile-empty" hidden><p>Henüz çalışma oluşturmadın.</p><a href="/studyo.html">Taktik Tahtasını Aç →</a><a href="/mac-studyosu">Maç Stüdyosunu Aç →</a></div>

  <section class="profile-weekly" aria-labelledby="profileWeeklyTitle"><div><p class="profile-kicker">11 OYUNCU. SENİN SEÇİMİN.</p><h2 id="profileWeeklyTitle">Haftanın İlk 11’i</h2><p>Kendi kadronu oluştur.</p></div><a href="/haftanin-ilk-11i">İlk 11 Oluştur →</a></section>
  <section id="profileAccount" class="profile-card" aria-labelledby="profileAccountTitle"><h2 id="profileAccountTitle">Hesap</h2>
    <div class="profile-account-heading"><h3>Profil bilgileri</h3><button id="profileAccountEdit" type="button" aria-controls="profileEditForm" aria-expanded="false" disabled>Düzenle →</button></div>
    <dl id="profileReadOnly" class="profile-account-rows" hidden>
      <div><dt>Kullanıcı adı</dt><dd id="profileReadUsername"></dd></div>
      <div><dt>Görünen ad</dt><dd id="profileReadDisplayName"></dd></div>
      <div><dt>E-posta</dt><dd id="profileReadEmail"></dd></div>
    </dl>

    <p id="profileStatus" role="status" aria-live="polite" aria-atomic="true"></p>
    <button id="profileRetry" type="button" hidden>Tekrar dene</button>

      <label for="profileUsername">Kullanıcı adı</label>
      <input id="profileUsername" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="profileUsernameHelp">

      <input id="profileDisplayName" name="display_name" type="text" autocomplete="nickname" aria-describedby="profileDisplayNameHelp">
      <p id="profileDisplayNameHelp" class="profile-help">En fazla 60 karakter.</p>
      <div class="profile-form-actions"><button id="profileSave" type="submit">Değişiklikleri kaydet</button><button id="profileCancel" type="button">Vazgeç</button></div>
    </form>
    <section id="profileFavorite" class="profile-favorite" aria-label="Futbol tercihi"></section>
    <div class="profile-session-row"><span>Oturum</span><button id="profileSignOut" type="button">Çıkış Yap →</button></div>
  </section>
