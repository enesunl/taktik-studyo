<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap — Taktik Stüdyo</title>
  <link rel="stylesheet" href="auth.css">
  <script src="backend.js" defer></script>
</head>
<body data-auth-page="login">
  <main class="auth-card">
    <a class="brand" href="/">TAKTİK STÜDYO</a>
    <p class="eyebrow">HESABIN</p>
    <h1>Tekrar hoş geldin.</h1>
    <p class="intro">E-posta adresin ve şifrenle giriş yap.</p>
    <p id="authMessage" class="message" role="alert" aria-live="polite" aria-atomic="true"></p>
    <form id="authForm">
      <label for="email">E-posta</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Şifre</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="authSubmit" type="submit" disabled>Giriş Yap</button>
    </form>
    <p id="profileMessage" class="profile-message" role="status" aria-live="polite"></p>
    <p class="footnote">Hesabın yok mu? <a href="kayit.html">Kayıt Ol</a></p>
    <p class="footnote"><a href="/sifremi-unuttum.html">Şifremi unuttum</a></p>
    <noscript>Giriş yapabilmek için JavaScript'i etkinleştir.</noscript>
  </main>
</body>
</html>
