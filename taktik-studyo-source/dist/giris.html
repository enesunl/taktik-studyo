<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap — Taktik Stüdyo</title>
  <script src="theme.js"></script><link rel="stylesheet" href="auth.css">
  <script src="backend.js" defer></script>
<link rel="stylesheet" href="theme.css"></head>
<body data-auth-page="login">
  <main class="auth-card"><div class="auth-theme-controls"><button type="button" class="theme-toggle" data-theme-toggle aria-label="Renk temasını değiştir" aria-pressed="false">Tema</button></div>
    <a class="brand" href="/">TAKTİK STÜDYO</a>
    <p class="eyebrow">HESABIN</p>
    <h1>Tekrar hoş geldin.</h1>
    <p class="intro">E-posta adresin ve şifrenle giriş yap.</p>
    <p id="authMessage" class="message" role="alert" aria-live="polite" aria-atomic="true"></p>
    <form id="authForm">
      <label for="email">E-posta</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Şifre</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="authSubmit" type="submit" disabled>Giriş Yap</button>
    </form>
    <!-- SEC2.2: shown only when the Auth server reports the Google provider as enabled. -->
    <div id="oauthActions" class="oauth-actions" hidden>
      <p class="oauth-divider"><span>veya</span></p>
      <button id="googleAuth" type="button" class="oauth-google" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9h-4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.7V6.6h-4a12 12 0 0 0 0 10.8l4-3z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg><span>Google ile devam et</span></button>
      <p class="hint">İlk Google girişinde kullanıcı adını seçip Kullanım Koşulları’nı onaylaman istenir.</p>
    </div>
    <p id="profileMessage" class="profile-message" role="status" aria-live="polite"></p>
    <p class="footnote">Hesabın yok mu? <a href="kayit.html">Kayıt Ol</a></p>
    <p class="footnote"><a href="/sifremi-unuttum.html">Şifremi unuttum</a></p>
    <nav class="legal-links" aria-label="Yasal metinler"><a href="/kvkk-aydinlatma-metni.html">KVKK</a><a href="/gizlilik-politikasi.html">Gizlilik</a><a href="/kullanim-kosullari.html">Kullanım Koşulları</a><a href="/cerez-politikasi.html">Çerezler</a><a href="/iletisim.html">İletişim</a></nav>
    <noscript>Giriş yapabilmek için JavaScript'i etkinleştir.</noscript>
  </main>
</body>
</html>
